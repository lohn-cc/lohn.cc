name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; later pushes wait for the running deploy.
concurrency:
  group: deploy-lohn.cc
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUGO_VERSION: "0.167.0"
  DEPLOY_HOST: mail.lohn.cc
  DEPLOY_USER: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hugo (checksum verified)
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " $tarball\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" hugo
          sudo install hugo /usr/local/bin/hugo
          hugo version

      - name: Build
        run: hugo --gc --minify --panicOnWarning

      - name: Deploy to server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "mail.lohn.cc ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOt26eddXIQQBfelO/1hrHxKPBBHGE2NtX+v1D1JvR4o" > ~/.ssh/known_hosts
          rsync -rlptz --delete --delete-after --delay-updates --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            public/ "${DEPLOY_USER}@${DEPLOY_HOST}:"
          echo "Deployed to https://www.lohn.cc/"

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
