baseURL = "https://www.lohn.cc/"
locale = "en"
title = "Nakhonekham (Lohn) Xongmixay"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = true
timeZone = "Asia/Vientiane"

[params]
  name = "Nakhonekham Xongmixay"
  nickname = "Lohn"
  description = "Nakhonekham (Lohn) Xongmixay — IT and Facilities Management leader with over two decades of experience across luxury hospitality, healthcare, manufacturing, and research institutions in Laos."
  tagline = "IT & Facilities Management Leader · Systems & Biomedical Engineer"
  email = "lohn@lohn.cc"
  location = "Vientiane, Lao PDR"
  linkedin = "https://www.linkedin.com/in/lohn-xongmixay"
  company = "https://www.vangera.systems/"
  companyName = "Vangera Systems"
  titleSuffix = "Lohn Xongmixay"   # appended to every page title except the home page
  profiles = []                   # extra sameAs URLs that ARE you, e.g. a GitHub profile
  highlights = 3          # bullets shown per role before "Show all"
  foundationBefore = 2010 # roles starting before this year are grouped under "Foundation years"

  # Google AdSense — leave disabled until the site is approved.
  # When enabling, the Content-Security-Policy in Caddy must also be relaxed for www.lohn.cc.
  [params.adsense]
    enabled = true
    client = "ca-pub-8408966451102848"

[permalinks]
  notes = "/notes/:slug/"

# profile.json — machine-readable CV consumed by www.vangera.systems at build time.
[outputFormats.profile]
  mediaType = "application/json"
  baseName = "profile"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "profile"]
  section = ["html", "rss"]

[markup.goldmark.renderer]
  unsafe = false

# Google ignores changefreq and priority; only an accurate <lastmod> matters.
[sitemap]
  filename = "sitemap.xml"
